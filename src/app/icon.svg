<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161722"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="50%" stop-color="#00c4cc"/>
      <stop offset="100%" stop-color="#fe2c55"/>
    </linearGradient>

    <!-- Download Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pink Glow -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.9"/>

  <!-- Ambient light orbs inside squircle -->
  <circle cx="160" cy="180" r="100" fill="#25f4ee" opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="350" cy="330" r="110" fill="#fe2c55" opacity="0.14" filter="url(#glowPink)"/>

  <!-- Stylized TikTok Music Note & Download Fusion -->
  <g transform="translate(0, -10)">
    <!-- Cyan Chromatic Shadow Layer -->
    <g transform="translate(-7, -5)" opacity="0.85">
      <!-- Music Note Hook (top right) -->
      <path d="M 285 130 C 310 130 338 142 355 162 C 370 178 376 198 376 220 L 376 235 C 352 235 328 226 312 212 C 304 204 298 194 294 184 L 294 280" 
            fill="none" stroke="#25f4ee" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Download Arrow Stem & Head -->
      <path d="M 248 140 L 248 290" fill="none" stroke="#25f4ee" stroke-width="34" stroke-linecap="round"/>
      <path d="M 180 250 L 248 318 L 316 250" fill="none" stroke="#25f4ee" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Download Base Tray -->
      <path d="M 160 360 L 336 360" fill="none" stroke="#25f4ee" stroke-width="32" stroke-linecap="round"/>
    </g>

    <!-- Pink Chromatic Shadow Layer -->
    <g transform="translate(7, 5)" opacity="0.85">
      <!-- Music Note Hook (top right) -->
      <path d="M 285 130 C 310 130 338 142 355 162 C 370 178 376 198 376 220 L 376 235 C 352 235 328 226 312 212 C 304 204 298 194 294 184 L 294 280" 
            fill="none" stroke="#fe2c55" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Download Arrow Stem & Head -->
      <path d="M 248 140 L 248 290" fill="none" stroke="#fe2c55" stroke-width="34" stroke-linecap="round"/>
      <path d="M 180 250 L 248 318 L 316 250" fill="none" stroke="#fe2c55" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Download Base Tray -->
      <path d="M 160 360 L 336 360" fill="none" stroke="#fe2c55" stroke-width="32" stroke-linecap="round"/>
    </g>

    <!-- Core Crisp White Layer -->
    <g transform="translate(0, 0)">
      <!-- Music Note Hook (top right) -->
      <path d="M 285 130 C 310 130 338 142 355 162 C 370 178 376 198 376 220 L 376 235 C 352 235 328 226 312 212 C 304 204 298 194 294 184 L 294 280" 
            fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Download Arrow Stem & Head -->
      <path d="M 248 140 L 248 290" fill="none" stroke="url(#arrowGrad)" stroke-width="32" stroke-linecap="round"/>
      <path d="M 180 250 L 248 318 L 316 250" fill="none" stroke="url(#arrowGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Download Base Tray -->
      <path d="M 160 360 L 336 360" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Sparkle details -->
  <!-- Top Left Sparkle -->
  <path d="M 110 110 Q 110 135 85 135 Q 110 135 110 160 Q 110 135 135 135 Q 110 135 110 110 Z" fill="#25f4ee"/>
  <!-- Bottom Right Mini Sparkle -->
  <path d="M 400 390 Q 400 405 385 405 Q 400 405 400 420 Q 400 405 415 405 Q 400 405 400 390 Z" fill="#fe2c55"/>
</svg>
